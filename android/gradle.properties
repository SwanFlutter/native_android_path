# Disables Kotlin incremental compilation for this module.
# Fixes cross-drive build failure on Windows when Pub Cache (C:\Users\...\AppData\Local\Pub\Cache)
# and the Flutter project (e.g. G:\Android\...) are on different drives.
# Kotlin's incremental compiler uses File.relativeTo() to store source paths; this call
# throws IllegalArgumentException when the two paths are on different Windows drives.
# This property is read directly by the Kotlin daemon — it is the only reliable way
# to disable incremental compilation at the module level.
# See: FLUTTER_PLUGIN_FIXES.md — Fix 1
kotlin.incremental=false
